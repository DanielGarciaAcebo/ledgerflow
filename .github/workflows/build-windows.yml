name: Build Windows portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: LedgerFlow version
        required: true
        default: "1.0.0"

  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: packaging/windows/requirements.txt

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $version = "${{ inputs.version }}"
          }
          else {
              $version = "${{ github.ref_name }}".TrimStart("v")
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Invalid version: $version"
          }

          "LEDGERFLOW_VERSION=$version" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "Building LedgerFlow $version"

      - name: Build portable Windows package
        shell: pwsh
        run: |
          ./packaging/windows/build_windows.ps1 `
              -Version $env:LEDGERFLOW_VERSION

      - name: Verify generated package
        shell: pwsh
        run: |
          $zip = (
              "release/LedgerFlow-{0}-windows-x86_64.zip" `
              -f $env:LEDGERFLOW_VERSION
          )

          if (-not (Test-Path -LiteralPath $zip)) {
              throw "Generated ZIP not found: $zip"
          }

          Get-Item $zip |
              Format-List `
                  Name,
                  Length,
                  FullName

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          path: release/LedgerFlow-${{ env.LEDGERFLOW_VERSION }}-windows-x86_64.zip
          if-no-files-found: error
          archive: false