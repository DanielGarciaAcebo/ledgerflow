<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">LedgerFlow app icon</title>
  <desc id="desc">
    Rounded blue and teal icon with a spreadsheet grid and an upward flowing arrow.
  </desc>

  <defs>
    <linearGradient id="backgroundGradient" x1="72" y1="48" x2="440" y2="464">
      <stop offset="0%" stop-color="#0A2A88" />
      <stop offset="52%" stop-color="#0877D1" />
      <stop offset="100%" stop-color="#12C7C7" />
    </linearGradient>

    <linearGradient id="cellGradient" x1="150" y1="150" x2="330" y2="350">
      <stop offset="0%" stop-color="#DDF8FF" />
      <stop offset="100%" stop-color="#52D8E5" />
    </linearGradient>

    <linearGradient id="arrowGradient" x1="126" y1="362" x2="406" y2="114">
      <stop offset="0%" stop-color="#10C6C3" />
      <stop offset="45%" stop-color="#0C8FDA" />
      <stop offset="100%" stop-color="#073B9C" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="12"
        flood-color="#021533"
        flood-opacity="0.28"
      />
    </filter>
  </defs>

  <rect
    x="48"
    y="48"
    width="416"
    height="416"
    rx="96"
    fill="url(#backgroundGradient)"
    filter="url(#softShadow)"
  />

  <rect
    x="112"
    y="118"
    width="288"
    height="276"
    rx="28"
    fill="#071C54"
    fill-opacity="0.28"
    stroke="#D8FAFF"
    stroke-opacity="0.48"
    stroke-width="4"
  />

  <rect
    x="140"
    y="144"
    width="232"
    height="42"
    rx="12"
    fill="#E7FCFF"
    fill-opacity="0.92"
  />

  <g fill="url(#cellGradient)">
    <rect x="140" y="206" width="62" height="56" rx="10" />
    <rect x="217" y="206" width="62" height="56" rx="10" />
    <rect x="294" y="206" width="78" height="56" rx="10" />

    <rect x="140" y="278" width="62" height="56" rx="10" />
    <rect x="217" y="278" width="62" height="56" rx="10" />
    <rect x="294" y="278" width="78" height="56" rx="10" />

    <rect x="140" y="350" width="62" height="18" rx="9" />
    <rect x="217" y="350" width="62" height="18" rx="9" />
    <rect x="294" y="350" width="78" height="18" rx="9" />
  </g>

  <path
    d="M116 382
       C184 354 236 350 282 322
       C329 294 359 249 378 196"
    fill="none"
    stroke="#6CF5EE"
    stroke-opacity="0.8"
    stroke-width="22"
    stroke-linecap="round"
  />

  <path
    d="M112 394
       C181 347 236 346 290 309
       C333 280 359 235 378 183
       L350 176
       L414 126
       L412 206
       L393 188
       C368 260 330 316 272 347
       C221 375 170 379 112 394
       Z"
    fill="url(#arrowGradient)"
    stroke="#062C79"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <path
    d="M137 372
       C198 342 246 337 292 306"
    fill="none"
    stroke="#B7FFFF"
    stroke-opacity="0.55"
    stroke-width="7"
    stroke-linecap="round"
  />
</svg>
